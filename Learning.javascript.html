<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas Example</title>
    <style>
       canvas {
         border: 1px solid black;
       }
    </style>
  </head>
  <body>
    <canvas id="myCanvas" width="400" height="200"></canvas>
    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
     
      //Create a new image object
      const img = new Image ();

      // Set yje source  of the image 
      img.src = "gaia-goddess.jpg";

      // When the image is loaded, draw it onto the canvas
      img.onload = function () {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      };

      // Add click event listener to spin the image
      canvas.addEventListener("click", function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const angle = 0;
        rotateImage(img, angle);
      });

      // Function to rotate the image
      function rotateImage(image, angle) {
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((angle * Math.PI) / 180);
        ctx.drawImage(
          image,
          -canvas.width / 2,
          -canvas.height / 2,
           canvas.width, 
           canvas.height

        );
        ctx.restore();

        //Increment angle for next rotation
        const newAngle = angle + 10;
        if (newAngle < 360) {
           setTimeout(function () {
            rotateImage(image,  newAngle);

        }, 100);
        }
      }
      </script>
        
  </body>

</html>
